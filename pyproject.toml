[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-2-0-integration"
version = "0.1.0"
description = "Integration bridge between ULTRON core and Mark-LVI runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["ultron_2_0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
